<section class="section" id="projekty">
  <div class="container">
    <p class="section-label">{{ t().projects.label }}</p>
    <h2 class="section-title">{{ t().projects.title }}</h2>
    <p class="section-lead">{{ t().projects.lead }}</p>

    <app-project-showcase [projects]="projects" />

    <a
      class="projects__more"
      href="https://github.com/TymekB/"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ t().projects.more }}
      <app-icon name="arrow-up-right" [size]="16" />
    </a>
  </div>
</section>

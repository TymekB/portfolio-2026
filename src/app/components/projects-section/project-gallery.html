<div
  class="gallery"
  role="group"
  [attr.aria-label]="projectName()"
  [attr.aria-roledescription]="hasControls() ? t().projects.gallery.roleDescription : null"
  (pointerdown)="onSwipeStart($event)"
  (pointerup)="onSwipeEnd($event)"
  (pointercancel)="onSwipeCancel()"
  (mouseenter)="hold(true)"
  (mouseleave)="hold(false)"
  (focusin)="hold(true)"
  (focusout)="hold(false)"
  (keydown.arrowLeft)="go(index() - 1)"
  (keydown.arrowRight)="go(index() + 1)"
>
  <div class="gallery__track" [style.transform]="offset()">
    @for (shot of shots(); track shot.src; let slide = $index) {
      <div class="gallery__slide" [attr.aria-hidden]="slide === index() ? null : 'true'">
        <img
          class="gallery__image"
          [src]="shot.src"
          [alt]="alt(shot)"
          width="1200"
          height="680"
          loading="lazy"
          decoding="async"
          draggable="false"
        />
      </div>
    }
  </div>

  <div class="gallery__bar">
    @if (current().href) {
      <a
        class="gallery__caption gallery__caption--link"
        [href]="current().href"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ caption(current()) }}
        <app-icon name="arrow-up-right" [size]="12" />
      </a>
    } @else {
      <span class="gallery__caption">{{ caption(current()) }}</span>
    }

    @if (canAutoplay()) {
      <button
        type="button"
        class="gallery__playback"
        [attr.aria-label]="paused() ? t().projects.gallery.play : t().projects.gallery.pause"
        [attr.aria-pressed]="paused()"
        (click)="togglePlayback()"
      >
        <app-icon [name]="paused() ? 'play' : 'pause'" [size]="13" />
      </button>
    }
  </div>

  @if (hasControls()) {
    <button
      type="button"
      class="gallery__arrow gallery__arrow--prev"
      [attr.aria-label]="t().projects.gallery.previous"
      (click)="go(index() - 1)"
    >
      <app-icon name="chevron-left" [size]="18" />
    </button>

    <button
      type="button"
      class="gallery__arrow gallery__arrow--next"
      [attr.aria-label]="t().projects.gallery.next"
      (click)="go(index() + 1)"
    >
      <app-icon name="chevron-right" [size]="18" />
    </button>
  }
</div>

@if (hasControls()) {
  <div class="rail" (mouseenter)="hold(true)" (mouseleave)="hold(false)">
    @for (shot of shots(); track shot.src; let slide = $index) {
      <button
        type="button"
        class="rail__item"
        [class.rail__item--active]="slide === index()"
        [attr.aria-current]="slide === index() ? 'true' : null"
        (click)="go(slide)"
      >
        <img
          class="rail__image"
          [src]="shot.src"
          [alt]="alt(shot)"
          width="1200"
          height="680"
          loading="lazy"
          decoding="async"
          draggable="false"
        />
        <span class="rail__label">{{ caption(shot) }}</span>
      </button>
    }
  </div>
}

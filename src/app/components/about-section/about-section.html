<section class="section" id="o-mnie">
  <div class="container">
    <p class="section-label">{{ t().about.label }}</p>
    <h2 class="section-title">{{ t().about.title }}</h2>

    <div class="about__grid">
      <div class="about__prose">
        @for (paragraph of t().about.paragraphs; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </div>

      <ul class="principles">
        @for (principle of t().about.principles; track principle.title) {
          <li class="principle">
            <h3 class="principle__title">{{ principle.title }}</h3>
            <p class="principle__body">{{ principle.body }}</p>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
